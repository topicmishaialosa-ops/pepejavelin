name: Build & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (Loom)
        run: ./gradlew build --no-daemon

      - name: Locate client jar
        id: jar
        run: |
          ls build/libs/
          JAR="$(ls build/libs/*.jar | grep -vE '-(dev|sources)' | head -1)"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Republish 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="${{ steps.jar.outputs.jar }}"
          # удалить старый релиз/тег (если был), затем создать свежий
          gh release delete latest --yes --cleanup-tag || true
          gh release create "latest" "$JAR" \
              --title "huihuiclient latest (1.21.4)" \
              --notes "Автосборка Fabric-клиента (1.21.4) из main. Это мод — положи в .minecraft/mods/. Подробности: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"